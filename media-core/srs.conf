listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;

http_api { enabled on; listen 1985; }
http_server { enabled on; listen 8080; dir ./objs/nginx/html; }

vhost __defaultVhost__ {
    hls { enabled on; hls_fragment 2; hls_window 10; hls_path ./objs/nginx/html; }
    dash { enabled on; dash_fragment 2; dash_window 10; dash_path ./objs/nginx/html; }
    rtc_server { enabled on; listen 8000; candidate $CANDIDATE; }
    rtc { enabled on; rtmp_to_rtc on; rtc_to_rtmp on; }
    dvr { enabled on; dvr_path ./objs/nginx/html/[app]/[stream].[timestamp].mp4; dvr_plan segment; dvr_duration 3600; }
    transcode { enabled on; }
}
