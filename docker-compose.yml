version: '3.8'
services:
  srs:
    image: ossrs/srs:5
    container_name: media_srs
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8080:8080"
      - "8000:8000/udp"
      - "9000-9100:9000-9100/udp"
    volumes:
      - ./media-core/srs.conf:/usr/local/srs/conf/srs.conf
      - srs_logs:/usr/local/srs/objs/logs
      - media_data:/usr/local/srs/objs/nginx/html
    environment:
      - CANDIDATE=${DOMAIN:-localhost}
    restart: always
    networks: [media-net]

  backend:
    build: ./backend
    container_name: media_backend
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=postgres://media:${POSTGRES_PASSWORD}@postgres:5432/media?sslmode=disable
      - SRS_API_URL=http://srs:1985
    volumes:
      - ./media-core/srs.conf:/etc/srs/srs.conf
      - media_data:/app/data
    depends_on: [postgres, srs]
    restart: always
    networks: [media-net]

  frontend:
    build: ./frontend
    container_name: media_frontend
    ports: ["3000:80"]
    depends_on: [backend]
    restart: always
    networks: [media-net]

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=media
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=media
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    networks: [media-net]

volumes:
  postgres_data:
  srs_logs:
  media_data:
networks:
  media-net:
